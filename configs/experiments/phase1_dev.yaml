# Phase-1 DEVELOPMENT benchmark (proposed five models).
# NOT official — selection_status remains pending confirmation.
# Uses a stratified-friendly train subsample for turnaround before full-data lock.

selection_status: proposed_pending_confirmation
allow_official_phase1_run: false
primary_metric: f1
cv_folds: 3
dev_train_subsample: 25000

phase1_models:
  - logistic_regression
  - random_forest
  - xgboost
  - lightgbm
  - mlp

all_supported_models:
  - logistic_regression
  - naive_bayes
  - knn
  - svm
  - random_forest
  - gradient_boosting
  - xgboost
  - lightgbm
  - catboost
  - mlp

model_overrides: {}
selection_rationale: >
  Development run of the proposed Phase-1 five spanning linear, bagging,
  boosting x2, and neural families. Pending supervisor confirmation before
  any official paper/panel numeric claims on full data.
