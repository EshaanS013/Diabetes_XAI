# Phase 1 model selection configuration
#
# STATUS: CONFIRMED by project owner (2026-08-25)
#
# Confirmed Phase-1 five (spanning linear, bagging, boosting x2, neural):
#   logistic_regression, random_forest, xgboost, lightgbm, mlp
#
# See docs/source_of_truth.md for proposal vs supervisor reconciliation.

selection_status: confirmed
confirmed_on: "2026-08-25"
confirmed_by: "project_owner"
selection_rationale: >
  Confirmed five-model Phase-1 suite: Logistic Regression (linear baseline),
  Random Forest (bagging), XGBoost (proposal primary booster), LightGBM
  (second booster), MLP (non-tree neural). Architecture still supports all ten
  registered algorithms for later phases.

phase1_models:
  - logistic_regression
  - random_forest
  - xgboost
  - lightgbm
  - mlp

all_supported_models:
  - logistic_regression
  - naive_bayes
  - knn
  - svm
  - random_forest
  - gradient_boosting
  - xgboost
  - lightgbm
  - catboost
  - mlp

model_overrides: {}

primary_metric: f1
cv_folds: 5

allow_official_phase1_run: true

# null = full training partition (official)
dev_train_subsample: null
