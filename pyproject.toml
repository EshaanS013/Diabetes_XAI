[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-diabetes-ai"
version = "0.1.0"
description = "Explainable AI for diabetes risk prediction (BRFSS2015) — research-grade pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diabetes XAI Research Team" }]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "imbalanced-learn>=0.11,<0.14",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<0.14",
  "pyyaml>=6.0,<7",
  "joblib>=1.3,<2",
  "tqdm>=4.66,<5",
  "optuna>=3.4,<5",
  "xgboost>=2.0,<3",
  "lightgbm>=4.0,<5",
  "catboost>=1.2,<2",
  "shap>=0.44,<0.53",
  "lime>=0.2.0.1,<0.3",
  "ucimlrepo>=0.0.7",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.5,<3",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
  "ruff>=0.3,<1",
]

[project.scripts]
dxai-prepare = "src.data.prepare:main"
dxai-train = "src.training.train:main"
dxai-evaluate = "src.evaluation.evaluate:main"
dxai-explain = "src.explainability.generate:main"
dxai-report = "src.reporting.generate_phase1_report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
